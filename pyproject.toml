[project]
name = "ingredion-agentic-ai-factory"
version = "0.2.0"
description = "Ingredion Agentic AI Factory on Google Cloud: shared runtime, Email Order Intake agent (A1-A10) and Pre-bill Validation agent (B1-B8)"
requires-python = ">=3.11"

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "-q"
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ruff]
line-length = 100
target-version = "py311"
extend-exclude = [".venv", "venv"]

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]
